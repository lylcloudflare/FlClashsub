name: server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: server
        run: python3 -m unittest -v test_auth_server
